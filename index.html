function startEnding(){dialog.style.display='none';state='ending';ending=0;pad.style.display='none';hud.style.display='none';beat=0;tone(880,.4);finale.classList.add('show');finalPage(0)}
function endingDraw(){rect(0,0,W,H,'#18172f')}
function loop(){frame++;update();let zone=background();if(zone!==lastZone&&state==='play'){lastZone=zone;setHud(zone)}if(state==='ending')endingDraw();requestAnimationFrame(loop)}
function bind(id,key){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[key]=true});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[key]=false)}bind('left','left');bind('right','right');bind('jump','jump');document.getElementById('start').onclick=()=>{document.getElementById('intro').style.display='none';sound(true);speak('🐱 SIR BIGOTES','¡Miau! Mi mapa tiene manchas de sopa… pero estoy seguro de que el castillo queda a la derecha. ¿Vamos?','¡VAMOS! ▶')};document.getElementById('sound').onclick=()=>sound(mute);document.getElementById('restart').onclick=()=>location.reload();document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft')keys.left=true;if(e.code==='ArrowRight')keys.right=true;if(['ArrowUp','Space'].includes(e.code))keys.jump=true;if(e.code==='Enter'&&state==='dialog')dialog.querySelector('button')?.click()});document.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')keys.left=false;if(e.code==='ArrowRight')keys.right=false;if(['ArrowUp','Space'].includes(e.code))keys.jump=false});loop();
